<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>morphxgen — topology</title>

  <!-- Brand webfonts: Intel One Mono (workhorse), Space Mono (display), Montserrat (wordmark) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@400;500;600&family=Montserrat:wght@200;300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* ---- MORPHXGEN tokens (authoritative) ---- */
      --mx-void:        #222222;
      --mx-void-deep:   #1a1a1a;
      --mx-void-raise:  #2b2b2b;
      --mx-bone:        #e4e3df;
      --mx-white:       #ffffff;
      --mx-coral:       #e48484;
      --mx-coral-dim:   #b76a6a;

      --mx-bone-08: rgba(228,227,223,0.08);
      --mx-bone-16: rgba(228,227,223,0.16);
      --mx-bone-24: rgba(228,227,223,0.24);
      --mx-bone-40: rgba(228,227,223,0.40);
      --mx-bone-55: rgba(228,227,223,0.55);
      --mx-bone-72: rgba(228,227,223,0.72);

      /* semantic aliases */
      --bg:           var(--mx-void);
      --text-primary: var(--mx-bone);
      --text-emphasis:var(--mx-white);
      --text-muted:   var(--mx-bone-55);
      --text-faint:   var(--mx-bone-40);
      --accent:       var(--mx-coral);
      --line:         var(--mx-bone-16);
      --line-soft:    var(--mx-bone-08);
      --line-strong:  var(--mx-bone-24);

      --font-display: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-mono:    "Intel One Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-sans:    "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --ls-wordmark: 0.10em; --ls-ui: 0.04em;
      --ease-mech: cubic-bezier(0.65, 0, 0.35, 1);
      --tick: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);            /* the void — never anything else */
      color: var(--text-primary);
      font-family: var(--font-mono);
      cursor: crosshair;
    }

    /* z-order: canvas(1) < labels(3) < frame(5) < hud(6) */
    #stage  { position: fixed; inset: 0; z-index: 1; }
    canvas  { display: block; }

    /* ---- Projected data labels (machine-terse, file-handle voice) ---- */
    #labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .data-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: var(--ls-ui);
      white-space: nowrap;
      color: var(--text-muted);
      will-change: transform, opacity;
    }
    .data-label .tick {
      display: inline-block;
      width: 6px; height: 6px;
      margin-right: 7px;
      background: var(--accent);     /* coral indicator — square, no glow */
      vertical-align: middle;
    }
    .data-label b { color: var(--text-primary); font-weight: 500; }
    .data-label small { color: var(--text-faint); }

    /* ---- Corner-tick bracket framing the viewport (signature motif) ---- */
    #frame { position: fixed; inset: 22px; z-index: 5; pointer-events: none; }
    #frame i { position: absolute; width: var(--tick); height: var(--tick); }
    #frame .tl { top: 0;    left: 0;    border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); }
    #frame .tr { top: 0;    right: 0;   border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }
    #frame .bl { bottom: 0; left: 0;    border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); }
    #frame .br { bottom: 0; right: 0;   border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }

    /* ---- HUD chrome ---- */
    #hud { position: fixed; left: 40px; top: 38px; z-index: 6; pointer-events: none; user-select: none; }
    #hud .wordmark {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: var(--ls-wordmark);
      color: var(--text-emphasis);
    }
    #hud .sub {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: var(--ls-ui);
      color: var(--text-muted);
    }
    #hud .manifesto {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: var(--text-faint);
      max-width: 280px;
      line-height: 1.45;
    }

    #readout {
      position: fixed; left: 40px; bottom: 36px; z-index: 6;
      font-size: 12.5px;
      letter-spacing: var(--ls-ui);
      color: var(--text-faint);
      pointer-events: none; user-select: none;
    }
    #readout b { color: var(--text-primary); font-weight: 500; }
    #readout .status { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: default; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

  <div id="hud">
    <div class="wordmark">MORPHXGEN</div>
    <div class="sub">topology // live</div>
    <div class="manifesto">generative form, traced from human structure. exactly what is needed, and nothing more.</div>
  </div>

  <div id="readout">
    nodes <b id="r-nodes">—</b> &nbsp;·&nbsp; edges <b id="r-edges">—</b> &nbsp;·&nbsp; origins <b id="r-origins">—</b> &nbsp;·&nbsp; <span class="status">growing<span id="r-dots">...</span></span> <b id="r-paths">—</b>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ============================================================
       CONFIG — bound to MORPHXGEN tokens. The sphere is IMAGERY, so
       the data palette is allowed inside it (cool-dominant, with
       coral/amber heat spots). Coral is the focus/active signal.
       ============================================================ */
    const MX = {
      void:   new THREE.Color(0x222222),
      bone:   new THREE.Color(0xe4e3df),
      white:  new THREE.Color(0xffffff),
      coral:  new THREE.Color(0xe48484),
      amber:  new THREE.Color(0xdd7d56),
      blue:   new THREE.Color(0x6b95c2),
      indigo: new THREE.Color(0x4c58ad),
    };

    const CONFIG = {
      // Geodesic frequency: each of the 20 base faces splits into freq*freq triangles.
      // freq 23 ≈ 9.2k triangles / 5292 nodes / 15870 edges (~2x the previous mesh).
      sphere: { radius: 2.4, frequency: 23 },
      color: {
        edgeRest: MX.bone.clone().multiplyScalar(0.016), // near-zero: just a hint of the topology
        nodeRest: MX.bone.clone().multiplyScalar(0.012),
        // network "heat" — cool-dominant, occasional warm coral/amber heat spots
        heats: [
          { c: MX.white,  w: 0.30 },
          { c: MX.blue,   w: 0.28 },
          { c: MX.bone,   w: 0.16 },
          { c: MX.coral,  w: 0.16 },
          { c: MX.amber,  w: 0.10 },
        ],
      },
      // Surface-constrained branching growth. Tips step in free bend
      // directions and snap back onto the sphere (geo1 = the surface), so
      // growth is NOT locked to the wireframe lattice — organic, non-uniform.
      growth: {
        maxActive:  REDUCE ? 2 : 3,    // concurrent growing networks (origins)
        spawnEvery: REDUCE ? [2.2, 4.5] : [1.2, 3.0],
        stepEvery:  0.045,             // seconds per breadth-first growth tick
        segLength:  0.16,              // local segment length
        bendDeg:    28,                // local bend angle (left/right)
        probBend:   0.5,               // per-side bend probability
        probStraight: 0.8,             // straight-continuation probability
        clearanceFactor: 0.6,          // clearance = factor * segLength (spacing/forks)
        cursorBias: 0.3,               // 0=ignore cursor, 1=grow hard toward it
        angleSlackDeg: 14,             // tolerance on the realized segment angle
        edgeTol:    0.5,               // off-surface reject (inert on a closed sphere)
        maxGen:     70,                // branch depth before a tip retires
        seedTips:   4,                 // initial tips fired from an origin
        seedSpread: 0.5,               // radians of jitter on the seed fan
        maxTips:    REDUCE ? 45 : 80,  // safety cap on simultaneous tips per network
        maxPts:     REDUCE ? 800 : 1600,
        decayPerSec: 0.4,              // growth-trail fade
        labelProb:  0.22,              // chance a new endpoint emits a data label
      },
      rotation: {
        steer: 0.55, ease: 0.045,
        idleSpeed: REDUCE ? 0 : 0.04,               // mechanical drift, no idle on reduced
      },
      breathing: { amp: REDUCE ? 0 : 0.01, speed: 0.7 },
      labels: { max: 38, life: [2.2, 4.2] },         // more data modules on the sphere
      bloom:  { strength: 0.45, radius: 0.15, threshold: 0.28 }, // tight neon glow, no frame-wide haze
    };

    // weighted heat picker
    const heatTotal = CONFIG.color.heats.reduce((s, h) => s + h.w, 0);
    function pickHeat() {
      let r = Math.random() * heatTotal;
      for (const h of CONFIG.color.heats) { if ((r -= h.w) <= 0) return h.c; }
      return MX.white;
    }

    /* ============================================================
       Scene
       ============================================================ */
    const stage = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(MX.void, 1);              // opaque void; additive lines float on it
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 8.2);

    const sculpture = new THREE.Group();
    scene.add(sculpture);

    // Post-processing: subtle bloom gives the bright additive paths a neon
    // glow. Threshold sits above the void (#222) and the near-zero wireframe,
    // so only the luminous paths smear — the background stays clean.
    const _sz = renderer.getDrawingBufferSize(new THREE.Vector2());
    const composerTarget = new THREE.WebGLRenderTarget(_sz.x, _sz.y, { type: THREE.HalfFloatType, samples: 4 });
    const composer = new EffectComposer(renderer, composerTarget);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      CONFIG.bloom.strength, CONFIG.bloom.radius, CONFIG.bloom.threshold
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    /* ============================================================
       Geodesic icosphere — Class-I subdivision at arbitrary frequency.
       Each of the icosahedron's 20 faces is split into freq*freq
       triangles and projected to the sphere, giving fine control over
       density (unlike `detail`, which only steps in powers of four).
       ============================================================ */
    function buildGeodesicIcosphere(radius, freq) {
      const ico = new THREE.IcosahedronGeometry(radius, 0); // 20 base faces, non-indexed
      const src = ico.getAttribute("position");
      const faceCount = src.count / 3;
      const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
      const ab = new THREE.Vector3(), ac = new THREE.Vector3();
      const out = [];
      const push = (v) => out.push(v.x, v.y, v.z);
      for (let f = 0; f < faceCount; f++) {
        A.fromBufferAttribute(src, f * 3);
        B.fromBufferAttribute(src, f * 3 + 1);
        C.fromBufferAttribute(src, f * 3 + 2);
        ab.subVectors(B, A).multiplyScalar(1 / freq);
        ac.subVectors(C, A).multiplyScalar(1 / freq);
        // barycentric grid of points P(i,j) = A + i*ab + j*ac, projected to the sphere
        const grid = [];
        for (let i = 0; i <= freq; i++) {
          grid[i] = [];
          for (let j = 0; j <= freq - i; j++) {
            const p = A.clone().addScaledVector(ab, i).addScaledVector(ac, j);
            p.normalize().multiplyScalar(radius);
            grid[i][j] = p;
          }
        }
        for (let i = 0; i < freq; i++) {
          for (let j = 0; j < freq - i; j++) {            // "up" triangles
            push(grid[i][j]); push(grid[i + 1][j]); push(grid[i][j + 1]);
          }
          for (let j = 0; j < freq - i - 1; j++) {        // "down" triangles
            push(grid[i + 1][j]); push(grid[i + 1][j + 1]); push(grid[i][j + 1]);
          }
        }
      }
      ico.dispose();
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(out, 3));
      return mergeVertices(g); // dedupe shared edge/corner vertices -> clean topology
    }

    let baseGeo = buildGeodesicIcosphere(CONFIG.sphere.radius, CONFIG.sphere.frequency);
    baseGeo.computeVertexNormals();

    const posAttr = baseGeo.getAttribute("position");
    const nodeCount = posAttr.count;
    const nodes = [];
    for (let i = 0; i < nodeCount; i++) nodes.push(new THREE.Vector3().fromBufferAttribute(posAttr, i));

    const index = baseGeo.getIndex();
    const edgeKey = (a, b) => (a < b ? a * nodeCount + b : b * nodeCount + a);
    const edgeSeen = new Set();
    const edges = [];
    function addEdge(a, b) {
      const key = edgeKey(a, b);
      if (edgeSeen.has(key)) return;
      edgeSeen.add(key);
      edges.push({ a, b });
    }
    for (let t = 0; t < index.count; t += 3) {
      const a = index.getX(t), b = index.getX(t + 1), c = index.getX(t + 2);
      addEdge(a, b); addEdge(b, c); addEdge(c, a);
    }
    const edgeCount = edges.length;

    /* ============================================================
       Wireframe: faint static topology — barely-there hints of the sphere.
       Nothing energizes it anymore, so its colour is set once at init.
       ============================================================ */
    const eRest = CONFIG.color.edgeRest;
    const linePositions = new Float32Array(edgeCount * 2 * 3);
    const lineColors = new Float32Array(edgeCount * 2 * 3);
    for (let e = 0; e < edgeCount; e++) {
      const { a, b } = edges[e];
      const pa = nodes[a], pb = nodes[b];
      linePositions.set([pa.x, pa.y, pa.z, pb.x, pb.y, pb.z], e * 6);
      lineColors.set([eRest.r, eRest.g, eRest.b, eRest.r, eRest.g, eRest.b], e * 6);
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    lineGeo.setAttribute("color", new THREE.BufferAttribute(lineColors, 3));
    const wireframe = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sculpture.add(wireframe);
    // No solid facets: additive lines with depthWrite:false render both hemispheres,
    // so the entire wireframe sphere is see-through.

    // Node points — faint static hairlights (set once).
    const nRest = CONFIG.color.nodeRest;
    const nodePositions = new Float32Array(nodeCount * 3);
    const nodeColors = new Float32Array(nodeCount * 3);
    for (let i = 0; i < nodeCount; i++) {
      nodePositions.set([nodes[i].x, nodes[i].y, nodes[i].z], i * 3);
      nodeColors.set([nRest.r, nRest.g, nRest.b], i * 3);
    }
    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute("position", new THREE.BufferAttribute(nodePositions, 3));
    nodeGeo.setAttribute("color", new THREE.BufferAttribute(nodeColors, 3));
    const nodePoints = new THREE.Points(nodeGeo, new THREE.PointsMaterial({
      size: 0.028, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    sculpture.add(nodePoints);

    /* ============================================================
       Surface-constrained branching growth (free-form on the sphere).
       Tips step in their own bend directions and snap back onto the
       sphere surface (geo1), so growth is NOT locked to the wireframe
       lattice. Each network generates its own glowing geometry that
       fades as a trail. Adapted from a per-frame Houdini growth solver:
       breadth-first (every live tip advances one step per tick, then
       retires), with boundary/angle gates, reconnection, and sibling
       overlap guards. The sphere makes closest_point/normal analytic.
       ============================================================ */
    const R = CONFIG.sphere.radius;
    const G = CONFIG.growth;
    const clearance  = G.clearanceFactor * G.segLength;
    const bendAngle  = THREE.MathUtils.degToRad(G.bendDeg);
    const angleSlack = THREE.MathUtils.degToRad(G.angleSlackDeg);

    // ---- generated-line ring buffer (additive, fades to invisible) ----
    const GROW_CAP = 6000;
    const growPos  = new Float32Array(GROW_CAP * 2 * 3);
    const growCol  = new Float32Array(GROW_CAP * 2 * 3);
    const segEnergy = new Float32Array(GROW_CAP);
    const segHeat   = new Float32Array(GROW_CAP * 3);
    const growGeo = new THREE.BufferGeometry();
    growGeo.setAttribute("position", new THREE.BufferAttribute(growPos, 3));
    growGeo.setAttribute("color", new THREE.BufferAttribute(growCol, 3));
    growGeo.setDrawRange(0, 0);
    const growLines = new THREE.LineSegments(growGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sculpture.add(growLines);
    let segCursor = 0, segMax = 0, posDirty = false;

    function addSegment(p1, p2, heat, energy) {
      const s = segCursor;
      segCursor = (segCursor + 1) % GROW_CAP;
      if (s + 1 > segMax) segMax = s + 1;
      const o6 = s * 6, o3 = s * 3;
      growPos[o6] = p1.x; growPos[o6 + 1] = p1.y; growPos[o6 + 2] = p1.z;
      growPos[o6 + 3] = p2.x; growPos[o6 + 4] = p2.y; growPos[o6 + 5] = p2.z;
      segHeat[o3] = heat.r; segHeat[o3 + 1] = heat.g; segHeat[o3 + 2] = heat.b;
      segEnergy[s] = energy;
      posDirty = true;
    }

    // Only ACTIVELY GROWING networks are tracked. Once a network saturates
    // (no live tips) it is dropped — its segments keep fading in the ring buffer.
    const networks = [];
    const _N = new THREE.Vector3(), _seg = new THREE.Vector3(), _attr = new THREE.Vector3();
    const _target = new THREE.Vector3(), _pt2 = new THREE.Vector3(), _up = new THREE.Vector3();

    const cellOf = (p) => `${Math.round(p.x / clearance)},${Math.round(p.y / clearance)},${Math.round(p.z / clearance)}`;
    function addPoint(net, pos, parentIdx) {
      const idx = net.pts.length;
      net.pts.push(pos);
      net.parent.push(parentIdx);
      const key = cellOf(pos);
      let cell = net.hash.get(key);
      if (!cell) { cell = []; net.hash.set(key, cell); }
      cell.push(idx);
      return idx;
    }
    // nearest network point within `clearance` of pos, excluding self/parent/grandparent
    function nearestPoint(net, pos, exA, exB, exC) {
      const cx = Math.round(pos.x / clearance), cy = Math.round(pos.y / clearance), cz = Math.round(pos.z / clearance);
      let best = -1, bestD = clearance;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
        const cell = net.hash.get(`${cx + dx},${cy + dy},${cz + dz}`);
        if (!cell) continue;
        for (const idx of cell) {
          if (idx === exA || idx === exB || idx === exC) continue;
          const d = net.pts[idx].distanceTo(pos);
          if (d < bestD) { bestD = d; best = idx; }
        }
      }
      return best;
    }

    function spawnGrowth() {
      if (networks.length >= G.maxActive) return;
      const o = new THREE.Vector3(Math.random() * 2 - 1, Math.random() * 2 - 1, Math.random() * 2 - 1);
      if (o.lengthSq() < 1e-4) o.set(0, 1, 0);
      o.normalize().multiplyScalar(R);
      const net = { heat: pickHeat(), pts: [], parent: [], hash: new Map(), tips: [] };
      const oi = addPoint(net, o, 0);
      net.parent[oi] = oi;
      // seed a fan of tips in tangent directions around the origin
      _N.copy(o).normalize();
      _up.set(0, 1, 0); if (Math.abs(_N.y) > 0.9) _up.set(1, 0, 0);
      const tA = new THREE.Vector3().crossVectors(_N, _up).normalize();
      const tB = new THREE.Vector3().crossVectors(_N, tA).normalize();
      for (let k = 0; k < G.seedTips; k++) {
        const a = (Math.PI * 2 * k) / G.seedTips + (Math.random() - 0.5) * G.seedSpread;
        const d = tA.clone().multiplyScalar(Math.cos(a)).addScaledVector(tB, Math.sin(a));
        net.tips.push({ i: oi, dir: d, gen: 0 });
      }
      networks.push(net);
      maybeLabelAt(o);
    }

    // Grow one tip: try left-bend / right-bend / straight, each gated by a draw.
    function growTip(net, tip, newEndpoints) {
      const pi = tip.i;
      const pt1 = net.pts[pi];
      _N.copy(pt1).normalize();
      // project current dir into the surface tangent plane
      const dirTan = tip.dir.clone().addScaledVector(_N, -tip.dir.dot(_N));
      if (dirTan.lengthSq() < 1e-6) dirTan.crossVectors(_N, _up).normalize(); else dirTan.normalize();

      // bias the heading toward the cursor's surface point (tangent-projected)
      if (attractorActive) {
        _attr.subVectors(attractorLocal, pt1).addScaledVector(_N, -_attr.dot(_N));
        if (_attr.lengthSq() > 1e-6) {
          dirTan.lerp(_attr.normalize(), G.cursorBias);
          if (dirTan.lengthSq() > 1e-6) dirTan.normalize();
        }
      }

      const exA = pi, exB = net.parent[pi], exC = net.parent[exB];
      const rL = Math.random(), rR = Math.random(), rS = Math.random();

      if (rL < G.probBend) {
        const dL = dirTan.clone().applyAxisAngle(_N, bendAngle);
        growBranch(net, pi, pt1, dirTan, dL, bendAngle, tip.gen, exA, exB, exC, newEndpoints);
      }
      if (rR < G.probBend) {
        const dR = dirTan.clone().applyAxisAngle(_N, -bendAngle);
        growBranch(net, pi, pt1, dirTan, dR, bendAngle, tip.gen, exA, exB, exC, newEndpoints);
      }
      if (rS < G.probStraight) {
        growBranch(net, pi, pt1, dirTan, dirTan.clone(), 0, tip.gen, exA, exB, exC, newEndpoints);
      }
    }

    // Attempt a single branch; returns nothing but may add a tip/segment/bridge.
    function growBranch(net, pi, pt1, dirTan, branchDir, maxAngle, gen, exA, exB, exC, newEndpoints) {
      if (net.pts.length >= G.maxPts) return;
      // 1. project intended target onto the surface (sphere: normalize * R)
      _target.copy(pt1).addScaledVector(branchDir, G.segLength);
      _pt2.copy(_target).normalize().multiplyScalar(R);
      // 2. BOUNDARY GATE — inert on a closed sphere (closest_point is always valid)
      // 3. ANGLE GATE on the realized segment (projected into the tangent plane)
      _seg.subVectors(_pt2, pt1);
      _seg.addScaledVector(_N, -_seg.dot(_N));
      if (_seg.lengthSq() > 1e-8) {
        const realized = Math.acos(THREE.MathUtils.clamp(_seg.normalize().dot(dirTan), -1, 1));
        if (realized > maxAngle + angleSlack) return;
      }
      // 4. NEIGHBOUR CHECK — reject growth into already-claimed space (no reconnection)
      if (nearestPoint(net, _pt2, exA, exB, exC) !== -1) return;
      // 5. SAME-FRAME SIBLING OVERLAP guard
      for (const e of newEndpoints) if (e.distanceTo(_pt2) < clearance) return;
      // 6. CREATE new tip + segment
      const p2 = _pt2.clone();
      const npi = addPoint(net, p2, pi);
      addSegment(pt1, p2, net.heat, 1);
      newEndpoints.push(p2);
      if (gen + 1 < G.maxGen && net.tips.length < G.maxTips) {
        const dirNew = p2.clone().sub(pt1);
        if (dirNew.lengthSq() < 1e-8) dirNew.copy(branchDir);
        net.tips.push({ i: npi, dir: dirNew.normalize(), gen: gen + 1 });
      }
      if (Math.random() < G.labelProb) maybeLabelAt(p2);
    }

    // One breadth-first growth tick across all networks.
    function growStep() {
      for (let ni = networks.length - 1; ni >= 0; ni--) {
        const net = networks[ni];
        if (net.tips.length === 0) { networks.splice(ni, 1); continue; } // saturated → retire
        const current = net.tips;
        net.tips = [];
        const newEndpoints = [];
        for (const tip of current) growTip(net, tip, newEndpoints);
      }
    }

    function totalTips() { let s = 0; for (const n of networks) s += n.tips.length; return s; }

    /* ============================================================
       Data labels — projected DOM, machine-terse file-handle voice
       ============================================================ */
    const labelLayer = document.getElementById("labels");
    const labelPool = [];
    const activeLabels = [];
    function getLabelEl() {
      if (labelPool.length) return labelPool.pop();
      const el = document.createElement("div");
      el.className = "data-label";
      labelLayer.appendChild(el);
      return el;
    }
    const hex6 = () => Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
    const labelFormats = [
      () => `node_<b>${Math.floor(Math.random() * 9000 + 1000)}</b>`,
      () => `strain <b>${(Math.random() * 100).toFixed(1)}</b><small>%</small>`,
      () => `<b>Δ${(Math.random() * 2 - 1).toFixed(2)}</b>`,
      () => `<b>0x${hex6()}</b>`,
      () => `<b>${(40 + Math.random() * 20).toFixed(3)}</b><small>°</small>`,
      () => `pts.<b>${String(Math.floor(Math.random() * 99)).padStart(2, "0")}</b>`,
      () => `<b>${(Math.random() * 9.999).toFixed(3)}</b><small>ms</small>`,
    ];
    // Spawn a data label anchored to a local-space position on the sphere.
    function maybeLabelAt(posVec) {
      if (activeLabels.length >= CONFIG.labels.max) return;
      const el = getLabelEl();
      const fmt = labelFormats[(Math.random() * labelFormats.length) | 0];
      el.innerHTML = `<span class="tick"></span>${fmt()}`;
      el.style.opacity = "0";
      const [lo, hi] = CONFIG.labels.life;
      activeLabels.push({ el, pos: posVec.clone(), age: 0, life: lo + Math.random() * (hi - lo) });
    }

    /* ============================================================
       Interaction: cursor steers rotation AND attracts growth.
       A lightweight ray-sphere hit (no rendering) gives the surface point
       under the cursor; growth biases its heading toward it.
       ============================================================ */
    const targetRot = new THREE.Vector2(0, 0);
    const steerInput = new THREE.Vector2(0, 0);
    const pointerNDC = new THREE.Vector2(0, 0);
    let pointerInside = false;

    const raycaster = new THREE.Raycaster();
    const hoverSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), CONFIG.sphere.radius);
    const _hit = new THREE.Vector3();
    const attractorLocal = new THREE.Vector3();
    let attractorActive = false;

    window.addEventListener("pointermove", (ev) => {
      pointerNDC.set((ev.clientX / window.innerWidth) * 2 - 1, -(ev.clientY / window.innerHeight) * 2 + 1);
      steerInput.copy(pointerNDC);
      pointerInside = true;
    });
    window.addEventListener("pointerleave", () => { steerInput.set(0, 0); pointerInside = false; });

    function updateAttractor() {
      attractorActive = false;
      if (!pointerInside) return;
      raycaster.setFromCamera(pointerNDC, camera);
      hoverSphere.radius = CONFIG.sphere.radius * sculpture.scale.x;
      if (!raycaster.ray.intersectSphere(hoverSphere, _hit)) return; // cursor off the sphere
      attractorLocal.copy(_hit);
      sculpture.worldToLocal(attractorLocal);
      attractorActive = true;
    }

    /* ============================================================
       Main loop
       ============================================================ */
    let lastSpawn = 0, nextSpawnIn = 0.4, growAccum = 0;
    const clock = new THREE.Clock();
    const r = {
      nodes:   document.getElementById("r-nodes"),
      edges:   document.getElementById("r-edges"),
      origins: document.getElementById("r-origins"),
      paths:   document.getElementById("r-paths"),
      dots:    document.getElementById("r-dots"),
    };
    r.nodes.textContent = nodeCount;
    r.edges.textContent = edgeCount;

    const _v = new THREE.Vector3();
    let dotsT = 0;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // spawn new growth origins on a randomized cadence
      lastSpawn += dt;
      if (lastSpawn >= nextSpawnIn) {
        spawnGrowth();
        lastSpawn = 0;
        const [s0, s1] = CONFIG.growth.spawnEvery;
        nextSpawnIn = s0 + Math.random() * (s1 - s0);
      }

      // update the cursor attractor (surface point the growth leans toward)
      updateAttractor();

      // breadth-first growth ticks (fixed cadence → slow, mechanical wavefront)
      growAccum += dt;
      let ticks = 0;
      while (growAccum >= G.stepEvery && ticks < 3) { growStep(); growAccum -= G.stepEvery; ticks++; }

      // decay the growth-trail energies (the fade)
      const gdecay = Math.pow(G.decayPerSec, dt);
      for (let s = 0; s < segMax; s++) segEnergy[s] *= gdecay;

      // write growth-segment colors (heat * energy; additive → faded = invisible)
      if (segMax > 0) {
        const gcols = growGeo.getAttribute("color");
        for (let s = 0; s < segMax; s++) {
          const en = segEnergy[s], o6 = s * 6, o3 = s * 3;
          const rr = segHeat[o3] * en, gg = segHeat[o3 + 1] * en, bb = segHeat[o3 + 2] * en;
          gcols.array[o6] = rr;     gcols.array[o6 + 1] = gg;     gcols.array[o6 + 2] = bb;
          gcols.array[o6 + 3] = rr; gcols.array[o6 + 4] = gg;     gcols.array[o6 + 5] = bb;
        }
        gcols.needsUpdate = true;
        if (posDirty) { growGeo.getAttribute("position").needsUpdate = true; growGeo.setDrawRange(0, segMax * 2); posDirty = false; }
      }

      // rotation: mechanical drift + soft steer toward cursor (no overshoot)
      targetRot.y += CONFIG.rotation.idleSpeed * dt;
      targetRot.y += steerInput.x * CONFIG.rotation.steer * dt;
      targetRot.x += -steerInput.y * CONFIG.rotation.steer * dt;
      targetRot.x = Math.max(-0.9, Math.min(0.9, targetRot.x));
      sculpture.rotation.y += (targetRot.y - sculpture.rotation.y) * CONFIG.rotation.ease;
      sculpture.rotation.x += (targetRot.x - sculpture.rotation.x) * CONFIG.rotation.ease;

      // breathing (restrained)
      const breathe = 1 + Math.sin(t * CONFIG.breathing.speed) * CONFIG.breathing.amp;
      sculpture.scale.setScalar(breathe);

      // labels (no glow — UI chrome; mechanical fade)
      for (let i = activeLabels.length - 1; i >= 0; i--) {
        const L = activeLabels[i];
        L.age += dt;
        const lifeT = L.age / L.life;
        if (lifeT >= 1) { L.el.style.opacity = "0"; labelPool.push(L.el); activeLabels.splice(i, 1); continue; }
        _v.copy(L.pos);
        sculpture.localToWorld(_v);
        const facing = _v.clone().sub(camera.position).normalize();
        const normal = _v.clone().sub(sculpture.position).normalize();
        const front = facing.dot(normal) < 0;
        _v.project(camera);
        const x = (_v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;
        L.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y - 16}px)`;
        const fade = Math.sin(Math.min(lifeT, 1) * Math.PI);
        L.el.style.opacity = front ? String(fade) : "0";
      }

      r.origins.textContent = String(networks.length).padStart(2, "0");
      r.paths.textContent = String(totalTips()).padStart(2, "0");
      dotsT += dt;
      if (dotsT > 0.4) { dotsT = 0; r.dots.textContent = ".".repeat((r.dots.textContent.length % 3) + 1); }

      composer.render();
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
