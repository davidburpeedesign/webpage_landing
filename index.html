<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>morphxgen — topology</title>

  <!-- Brand webfonts: Intel One Mono (workhorse), Space Mono (display), Montserrat (wordmark) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Intel+One+Mono:wght@400;500;600&family=Montserrat:wght@200;300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* ---- MORPHXGEN tokens (authoritative) ---- */
      --mx-void:        #222222;
      --mx-void-deep:   #1a1a1a;
      --mx-void-raise:  #2b2b2b;
      --mx-bone:        #e4e3df;
      --mx-white:       #ffffff;
      --mx-coral:       #e48484;
      --mx-coral-dim:   #b76a6a;

      --mx-bone-08: rgba(228,227,223,0.08);
      --mx-bone-16: rgba(228,227,223,0.16);
      --mx-bone-24: rgba(228,227,223,0.24);
      --mx-bone-40: rgba(228,227,223,0.40);
      --mx-bone-55: rgba(228,227,223,0.55);
      --mx-bone-72: rgba(228,227,223,0.72);

      /* semantic aliases */
      --bg:           var(--mx-void);
      --text-primary: var(--mx-bone);
      --text-emphasis:var(--mx-white);
      --text-muted:   var(--mx-bone-55);
      --text-faint:   var(--mx-bone-40);
      --accent:       var(--mx-coral);
      --line:         var(--mx-bone-16);
      --line-soft:    var(--mx-bone-08);
      --line-strong:  var(--mx-bone-24);

      --font-display: "Space Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-mono:    "Intel One Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --font-sans:    "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      --ls-wordmark: 0.10em; --ls-ui: 0.04em;
      --ease-mech: cubic-bezier(0.65, 0, 0.35, 1);
      --tick: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);            /* the void — never anything else */
      color: var(--text-primary);
      font-family: var(--font-mono);
      cursor: crosshair;
    }

    /* z-order: canvas(1) < labels(3) < frame(5) < hud(6) */
    #stage  { position: fixed; inset: 0; z-index: 1; }
    canvas  { display: block; }

    /* ---- Projected data labels (machine-terse, file-handle voice) ---- */
    #labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
    .data-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: var(--ls-ui);
      white-space: nowrap;
      color: var(--text-muted);
      will-change: transform, opacity;
    }
    .data-label .tick {
      display: inline-block;
      width: 6px; height: 6px;
      margin-right: 7px;
      background: var(--accent);     /* coral indicator — square, no glow */
      vertical-align: middle;
    }
    .data-label b { color: var(--text-primary); font-weight: 500; }
    .data-label small { color: var(--text-faint); }

    /* ---- Corner-tick bracket framing the viewport (signature motif) ---- */
    #frame { position: fixed; inset: 22px; z-index: 5; pointer-events: none; }
    #frame i { position: absolute; width: var(--tick); height: var(--tick); }
    #frame .tl { top: 0;    left: 0;    border-top: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); }
    #frame .tr { top: 0;    right: 0;   border-top: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }
    #frame .bl { bottom: 0; left: 0;    border-bottom: 1px solid var(--line-strong); border-left: 1px solid var(--line-strong); }
    #frame .br { bottom: 0; right: 0;   border-bottom: 1px solid var(--line-strong); border-right: 1px solid var(--line-strong); }

    /* ---- HUD chrome ---- */
    #hud { position: fixed; left: 40px; top: 38px; z-index: 6; pointer-events: none; user-select: none; }
    #hud .wordmark {
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 22px;
      letter-spacing: var(--ls-wordmark);
      color: var(--text-emphasis);
    }
    #hud .sub {
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: var(--ls-ui);
      color: var(--text-muted);
    }
    #hud .manifesto {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: -0.01em;
      color: var(--text-faint);
      max-width: 280px;
      line-height: 1.45;
    }

    #readout {
      position: fixed; left: 40px; bottom: 36px; z-index: 6;
      font-size: 12.5px;
      letter-spacing: var(--ls-ui);
      color: var(--text-faint);
      pointer-events: none; user-select: none;
    }
    #readout b { color: var(--text-primary); font-weight: 500; }
    #readout .status { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      html, body { cursor: default; }
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="labels"></div>

  <div id="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

  <div id="hud">
    <div class="wordmark">MORPHXGEN</div>
    <div class="sub">topology // live</div>
    <div class="manifesto">generative form, traced from human structure. exactly what is needed, and nothing more.</div>
  </div>

  <div id="readout">
    nodes <b id="r-nodes">—</b> &nbsp;·&nbsp; edges <b id="r-edges">—</b> &nbsp;·&nbsp; origins <b id="r-origins">—</b> &nbsp;·&nbsp; <span class="status">growing<span id="r-dots">...</span></span> <b id="r-paths">—</b>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
    import { FullScreenQuad } from "three/addons/postprocessing/Pass.js";

    const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    /* ============================================================
       CONFIG — bound to MORPHXGEN tokens. The sphere is IMAGERY, so
       the data palette is allowed inside it (cool-dominant, with
       coral/amber heat spots). Coral is the focus/active signal.
       ============================================================ */
    const MX = {
      void:   new THREE.Color(0x222222),
      bone:   new THREE.Color(0xe4e3df),
      white:  new THREE.Color(0xffffff),
      coral:  new THREE.Color(0xe48484),
      amber:  new THREE.Color(0xdd7d56),
      blue:   new THREE.Color(0x6b95c2),
      indigo: new THREE.Color(0x4c58ad),
    };

    const CONFIG = {
      // Geodesic frequency: each of the 20 base faces splits into freq*freq triangles.
      // freq 23 ≈ 9.2k triangles / 5292 nodes / 15870 edges (~2x the previous mesh).
      sphere: { radius: 2.4, frequency: 23 },
      color: {
        edgeRest: new THREE.Color(0x000000), // ungrown edges hidden (additive black = invisible)
        nodeRest: new THREE.Color(0x000000), // ungrown nodes hidden
        // network "heat" — cool-dominant, occasional warm coral/amber heat spots
        heats: [
          { c: MX.white,  w: 0.30 },
          { c: MX.blue,   w: 0.28 },
          { c: MX.bone,   w: 0.16 },
          { c: MX.coral,  w: 0.16 },
          { c: MX.amber,  w: 0.10 },
        ],
      },
      // Edge-constrained branching growth. Agents walk ONLY along the
      // polygon edges of the sphere; ungrown edges stay hidden, so the
      // lattice reveals itself only where the growth currently traces it.
      growth: {
        maxActive:  REDUCE ? 2 : 3,    // concurrent growing networks (origins)
        spawnEvery: REDUCE ? [2.2, 4.5] : [1.0, 2.6],
        stepEvery:  0.05,              // seconds per breadth-first edge step (slow lightning)
        seedTips:   4,                 // initial agents fired from an origin node
        branchProb: 0.34,              // chance to fork down an extra edge at a node
        forwardBias: 0.55,             // weight on continuing the current heading
        cursorBias: 0.5,               // weight on heading toward the cursor's surface point
        maxGen:     90,                // edge-steps before an agent retires
        maxTips:    REDUCE ? 45 : 90,  // safety cap on simultaneous agents per network
        decayPerSec: 0.3,              // grown-edge trail fade
        labelProb:  0.16,              // chance a reached node emits a data label
      },
      rotation: {
        steer: 0.55, ease: 0.045,
        idleSpeed: REDUCE ? 0 : 0.04,               // mechanical drift, no idle on reduced
      },
      breathing: { amp: REDUCE ? 0 : 0.01, speed: 0.7 },
      labels: { max: 38, life: [2.2, 4.2] },         // more data modules on the sphere
      // Custom tight bloom: threshold-gate bright pixels, blur with a small
      // fixed-pixel Gaussian (glow hugs the paths, never washes the void).
      bloom:  { threshold: 0.05, knee: 0.1, strength: 2.00, blurPx: 1.00, iterations: 2 },
    };

    // weighted heat picker
    const heatTotal = CONFIG.color.heats.reduce((s, h) => s + h.w, 0);
    function pickHeat() {
      let r = Math.random() * heatTotal;
      for (const h of CONFIG.color.heats) { if ((r -= h.w) <= 0) return h.c; }
      return MX.white;
    }

    /* ============================================================
       Scene
       ============================================================ */
    const stage = document.getElementById("stage");
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(MX.void, 1);              // opaque void; additive lines float on it
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 8.2);

    const sculpture = new THREE.Group();
    scene.add(sculpture);

    /* ============================================================
       Custom tight bloom (replaces UnrealBloomPass, whose coarse mip
       levels always smear a frame-wide haze over the mid-gray void).
       Pipeline: scene → rtScene; threshold-gate bright pixels at half
       res; small fixed-pixel separable Gaussian blur (ping-pong);
       composite scene + glow*strength, encode to sRGB. The glow only
       reaches ~blurPx*4 texels (half res) from a path, so the void and
       the near-zero wireframe are never lifted.
       ============================================================ */
    const VERT = "attribute vec3 position;\nattribute vec2 uv;\nuniform mat4 modelViewMatrix;\nuniform mat4 projectionMatrix;\nvarying vec2 vUv;\nvoid main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }";

    const thresholdQuad = new FullScreenQuad(new THREE.RawShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uThreshold: { value: 0 }, uKnee: { value: 0 } },
      vertexShader: VERT,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tDiffuse; uniform float uThreshold; uniform float uKnee;
        varying vec2 vUv;
        void main() {
          vec3 c = texture2D(tDiffuse, vUv).rgb;
          float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
          float f = smoothstep(uThreshold, uThreshold + uKnee, l);
          gl_FragColor = vec4(c * f, 1.0);
        }`,
    }));

    const blurQuad = new FullScreenQuad(new THREE.RawShaderMaterial({
      uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2() } },
      vertexShader: VERT,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tDiffuse; uniform vec2 uDir;
        varying vec2 vUv;
        void main() {
          vec3 s = texture2D(tDiffuse, vUv).rgb * 0.227027;
          s += texture2D(tDiffuse, vUv + uDir * 1.0).rgb * 0.1945946;
          s += texture2D(tDiffuse, vUv - uDir * 1.0).rgb * 0.1945946;
          s += texture2D(tDiffuse, vUv + uDir * 2.0).rgb * 0.1216216;
          s += texture2D(tDiffuse, vUv - uDir * 2.0).rgb * 0.1216216;
          s += texture2D(tDiffuse, vUv + uDir * 3.0).rgb * 0.0540540;
          s += texture2D(tDiffuse, vUv - uDir * 3.0).rgb * 0.0540540;
          s += texture2D(tDiffuse, vUv + uDir * 4.0).rgb * 0.0162162;
          s += texture2D(tDiffuse, vUv - uDir * 4.0).rgb * 0.0162162;
          gl_FragColor = vec4(s, 1.0);
        }`,
    }));

    const compositeQuad = new FullScreenQuad(new THREE.RawShaderMaterial({
      uniforms: { tScene: { value: null }, tGlow: { value: null }, uStrength: { value: 0 } },
      vertexShader: VERT,
      fragmentShader: /* glsl */`
        precision highp float;
        uniform sampler2D tScene; uniform sampler2D tGlow; uniform float uStrength;
        varying vec2 vUv;
        vec3 toSRGB(vec3 c) {
          return mix(c * 12.92, 1.055 * pow(max(c, 0.0), vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
        }
        void main() {
          vec3 col = texture2D(tScene, vUv).rgb + texture2D(tGlow, vUv).rgb * uStrength;
          gl_FragColor = vec4(toSRGB(col), 1.0);
        }`,
    }));

    const rtScene   = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 });
    const rtBrightA = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
    const rtBrightB = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType });
    const _dbs = new THREE.Vector2();
    function sizeTargets() {
      renderer.getDrawingBufferSize(_dbs);
      const fw = Math.max(1, _dbs.x | 0), fh = Math.max(1, _dbs.y | 0);
      rtScene.setSize(fw, fh);
      rtBrightA.setSize(Math.max(1, fw >> 1), Math.max(1, fh >> 1));
      rtBrightB.setSize(Math.max(1, fw >> 1), Math.max(1, fh >> 1));
    }
    sizeTargets();

    function renderBloom() {
      const B = CONFIG.bloom;
      // 1. scene → rtScene (cleared to the void, additive paths on top)
      renderer.setRenderTarget(rtScene);
      renderer.render(scene, camera);
      // 2. threshold-gate bright pixels → rtBrightA (half res)
      thresholdQuad.material.uniforms.tDiffuse.value = rtScene.texture;
      thresholdQuad.material.uniforms.uThreshold.value = B.threshold;
      thresholdQuad.material.uniforms.uKnee.value = B.knee;
      renderer.setRenderTarget(rtBrightA);
      thresholdQuad.render(renderer);
      // 3. small separable Gaussian, ping-pong A↔B
      const bw = rtBrightA.width, bh = rtBrightA.height;
      for (let i = 0; i < B.iterations; i++) {
        blurQuad.material.uniforms.tDiffuse.value = rtBrightA.texture;
        blurQuad.material.uniforms.uDir.value.set(B.blurPx / bw, 0);
        renderer.setRenderTarget(rtBrightB);
        blurQuad.render(renderer);
        blurQuad.material.uniforms.tDiffuse.value = rtBrightB.texture;
        blurQuad.material.uniforms.uDir.value.set(0, B.blurPx / bh);
        renderer.setRenderTarget(rtBrightA);
        blurQuad.render(renderer);
      }
      // 4. composite to the screen (linear → sRGB)
      compositeQuad.material.uniforms.tScene.value = rtScene.texture;
      compositeQuad.material.uniforms.tGlow.value = rtBrightA.texture;
      compositeQuad.material.uniforms.uStrength.value = B.strength;
      renderer.setRenderTarget(null);
      compositeQuad.render(renderer);
    }

    /* ============================================================
       Geodesic icosphere — Class-I subdivision at arbitrary frequency.
       Each of the icosahedron's 20 faces is split into freq*freq
       triangles and projected to the sphere, giving fine control over
       density (unlike `detail`, which only steps in powers of four).
       ============================================================ */
    function buildGeodesicIcosphere(radius, freq) {
      const ico = new THREE.IcosahedronGeometry(radius, 0); // 20 base faces, non-indexed
      const src = ico.getAttribute("position");
      const faceCount = src.count / 3;
      const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
      const ab = new THREE.Vector3(), ac = new THREE.Vector3();
      const out = [];
      const push = (v) => out.push(v.x, v.y, v.z);
      for (let f = 0; f < faceCount; f++) {
        A.fromBufferAttribute(src, f * 3);
        B.fromBufferAttribute(src, f * 3 + 1);
        C.fromBufferAttribute(src, f * 3 + 2);
        ab.subVectors(B, A).multiplyScalar(1 / freq);
        ac.subVectors(C, A).multiplyScalar(1 / freq);
        // barycentric grid of points P(i,j) = A + i*ab + j*ac, projected to the sphere
        const grid = [];
        for (let i = 0; i <= freq; i++) {
          grid[i] = [];
          for (let j = 0; j <= freq - i; j++) {
            const p = A.clone().addScaledVector(ab, i).addScaledVector(ac, j);
            p.normalize().multiplyScalar(radius);
            grid[i][j] = p;
          }
        }
        for (let i = 0; i < freq; i++) {
          for (let j = 0; j < freq - i; j++) {            // "up" triangles
            push(grid[i][j]); push(grid[i + 1][j]); push(grid[i][j + 1]);
          }
          for (let j = 0; j < freq - i - 1; j++) {        // "down" triangles
            push(grid[i + 1][j]); push(grid[i + 1][j + 1]); push(grid[i][j + 1]);
          }
        }
      }
      ico.dispose();
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(out, 3));
      return mergeVertices(g); // dedupe shared edge/corner vertices -> clean topology
    }

    let baseGeo = buildGeodesicIcosphere(CONFIG.sphere.radius, CONFIG.sphere.frequency);
    baseGeo.computeVertexNormals();

    const posAttr = baseGeo.getAttribute("position");
    const nodeCount = posAttr.count;
    const nodes = [];
    for (let i = 0; i < nodeCount; i++) nodes.push(new THREE.Vector3().fromBufferAttribute(posAttr, i));

    const index = baseGeo.getIndex();
    const edgeKey = (a, b) => (a < b ? a * nodeCount + b : b * nodeCount + a);
    const edgeMap = new Map();          // node-pair key -> edge index (for lighting a walked edge)
    const adjacency = Array.from({ length: nodeCount }, () => []); // node -> neighbour nodes
    const edges = [];
    function addEdge(a, b) {
      const key = edgeKey(a, b);
      if (edgeMap.has(key)) return;
      edgeMap.set(key, edges.length);
      edges.push({ a, b });
      adjacency[a].push(b); adjacency[b].push(a);
    }
    for (let t = 0; t < index.count; t += 3) {
      const a = index.getX(t), b = index.getX(t + 1), c = index.getX(t + 2);
      addEdge(a, b); addEdge(b, c); addEdge(c, a);
    }
    const edgeCount = edges.length;

    /* ============================================================
       Wireframe: faint static topology — barely-there hints of the sphere.
       Nothing energizes it anymore, so its colour is set once at init.
       ============================================================ */
    const eRest = CONFIG.color.edgeRest;
    const linePositions = new Float32Array(edgeCount * 2 * 3);
    const lineColors = new Float32Array(edgeCount * 2 * 3);
    for (let e = 0; e < edgeCount; e++) {
      const { a, b } = edges[e];
      const pa = nodes[a], pb = nodes[b];
      linePositions.set([pa.x, pa.y, pa.z, pb.x, pb.y, pb.z], e * 6);
      lineColors.set([eRest.r, eRest.g, eRest.b, eRest.r, eRest.g, eRest.b], e * 6);
    }
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    lineGeo.setAttribute("color", new THREE.BufferAttribute(lineColors, 3));
    const wireframe = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    sculpture.add(wireframe);
    // No solid facets: additive lines with depthWrite:false render both hemispheres,
    // so the entire wireframe sphere is see-through.

    // Node points — faint static hairlights (set once).
    const nRest = CONFIG.color.nodeRest;
    const nodePositions = new Float32Array(nodeCount * 3);
    const nodeColors = new Float32Array(nodeCount * 3);
    for (let i = 0; i < nodeCount; i++) {
      nodePositions.set([nodes[i].x, nodes[i].y, nodes[i].z], i * 3);
      nodeColors.set([nRest.r, nRest.g, nRest.b], i * 3);
    }
    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute("position", new THREE.BufferAttribute(nodePositions, 3));
    nodeGeo.setAttribute("color", new THREE.BufferAttribute(nodeColors, 3));
    const nodePoints = new THREE.Points(nodeGeo, new THREE.PointsMaterial({
      size: 0.028, vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    }));
    sculpture.add(nodePoints);

    const G = CONFIG.growth;

    /* ============================================================
       Energy fields: a walked edge (and its endpoints) lights up at
       full energy, then decays into a fading trail. Ungrown edges/nodes
       sit at rest (black) and, under additive blending, are invisible —
       so the lattice only shows where the growth currently traces it.
       ============================================================ */
    const edgeEnergy = new Float32Array(edgeCount);
    const edgeHeat   = new Float32Array(edgeCount * 3);
    const nodeEnergy = new Float32Array(nodeCount);
    const nodeHeat   = new Float32Array(nodeCount * 3);

    function lightNode(n, heat, energy) {
      if (energy <= nodeEnergy[n]) return;
      nodeEnergy[n] = energy;
      nodeHeat[n * 3] = heat.r; nodeHeat[n * 3 + 1] = heat.g; nodeHeat[n * 3 + 2] = heat.b;
    }
    function lightEdge(a, b, heat, energy) {
      const ei = edgeMap.get(edgeKey(a, b));
      if (ei === undefined) return;
      edgeEnergy[ei] = energy;
      edgeHeat[ei * 3] = heat.r; edgeHeat[ei * 3 + 1] = heat.g; edgeHeat[ei * 3 + 2] = heat.b;
      lightNode(a, heat, energy); lightNode(b, heat, energy);
    }

    /* ============================================================
       Edge-constrained branching growth.
       A network starts at an origin node and fires several agents that
       walk ONLY along the polygon edges. At each node an agent gathers
       its unvisited neighbours, continues toward the one that best
       matches its heading + the cursor (forwardBias / cursorBias), and
       may fork down the others (branchProb). Breadth-first: every live
       agent advances one edge per tick, then retires. Networks saturate
       (no unvisited neighbours left) and are dropped; their edges fade.
       ============================================================ */
    const networks = [];
    const _dir = new THREE.Vector3(), _edge = new THREE.Vector3(), _toC = new THREE.Vector3();

    function spawnGrowth() {
      if (networks.length >= G.maxActive) return;
      const origin = (Math.random() * nodeCount) | 0;
      const net = { heat: pickHeat(), visited: new Set([origin]), tips: [] };
      // fire seed agents down distinct edges out of the origin
      const nbrs = adjacency[origin].slice();
      for (let i = nbrs.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [nbrs[i], nbrs[j]] = [nbrs[j], nbrs[i]]; }
      const seeds = Math.min(G.seedTips, nbrs.length);
      for (let s = 0; s < seeds; s++) {
        net.visited.add(nbrs[s]);
        lightEdge(origin, nbrs[s], net.heat, 1);
        net.tips.push({ node: nbrs[s], prev: origin, gen: 0 });
      }
      if (net.tips.length === 0) return;
      networks.push(net);
      maybeLabelAt(nodes[origin]);
    }

    // claim an edge node→nb: light it, reserve the node, spawn the child agent
    function claim(net, tip, nb) {
      net.visited.add(nb);
      lightEdge(tip.node, nb, net.heat, 1);
      net.tips.push({ node: nb, prev: tip.node, gen: tip.gen + 1 });
      if (Math.random() < G.labelProb) maybeLabelAt(nodes[nb]);
    }

    // score a candidate edge: continue heading + lean toward cursor + noise
    function scoreEdge(node, prev, nb) {
      _dir.subVectors(nodes[node], nodes[prev]).normalize();
      _edge.subVectors(nodes[nb], nodes[node]).normalize();
      let s = G.forwardBias * _dir.dot(_edge);
      if (attractorActive) {
        _toC.subVectors(attractorLocal, nodes[node]).normalize();
        s += G.cursorBias * _toC.dot(_edge);
      }
      return s + Math.random() * 0.5;
    }

    // One breadth-first edge step across all networks.
    function growStep() {
      for (let ni = networks.length - 1; ni >= 0; ni--) {
        const net = networks[ni];
        if (net.tips.length === 0) { networks.splice(ni, 1); continue; } // saturated → retire
        const current = net.tips;
        net.tips = [];
        for (const tip of current) {
          if (tip.gen >= G.maxGen) continue;
          // unvisited neighbours form the frontier
          const cands = [];
          for (const nb of adjacency[tip.node]) if (!net.visited.has(nb)) cands.push(nb);
          if (cands.length === 0) continue;
          // primary continuation = best-scoring frontier edge
          let best = cands[0], bestScore = -Infinity;
          for (const c of cands) { const sc = scoreEdge(tip.node, tip.prev, c); if (sc > bestScore) { bestScore = sc; best = c; } }
          claim(net, tip, best);
          // fork down the remaining frontier edges
          for (const c of cands) {
            if (c === best || net.tips.length >= G.maxTips) continue;
            if (Math.random() < G.branchProb) claim(net, tip, c);
          }
        }
      }
    }

    function totalTips() { let s = 0; for (const n of networks) s += n.tips.length; return s; }

    /* ============================================================
       Data labels — projected DOM, machine-terse file-handle voice
       ============================================================ */
    const labelLayer = document.getElementById("labels");
    const labelPool = [];
    const activeLabels = [];
    function getLabelEl() {
      if (labelPool.length) return labelPool.pop();
      const el = document.createElement("div");
      el.className = "data-label";
      labelLayer.appendChild(el);
      return el;
    }
    const hex6 = () => Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, "0");
    const labelFormats = [
      () => `node_<b>${Math.floor(Math.random() * 9000 + 1000)}</b>`,
      () => `strain <b>${(Math.random() * 100).toFixed(1)}</b><small>%</small>`,
      () => `<b>Δ${(Math.random() * 2 - 1).toFixed(2)}</b>`,
      () => `<b>0x${hex6()}</b>`,
      () => `<b>${(40 + Math.random() * 20).toFixed(3)}</b><small>°</small>`,
      () => `pts.<b>${String(Math.floor(Math.random() * 99)).padStart(2, "0")}</b>`,
      () => `<b>${(Math.random() * 9.999).toFixed(3)}</b><small>ms</small>`,
    ];
    // Spawn a data label anchored to a local-space position on the sphere.
    function maybeLabelAt(posVec) {
      if (activeLabels.length >= CONFIG.labels.max) return;
      const el = getLabelEl();
      const fmt = labelFormats[(Math.random() * labelFormats.length) | 0];
      el.innerHTML = `<span class="tick"></span>${fmt()}`;
      el.style.opacity = "0";
      const [lo, hi] = CONFIG.labels.life;
      activeLabels.push({ el, pos: posVec.clone(), age: 0, life: lo + Math.random() * (hi - lo) });
    }

    /* ============================================================
       Interaction: cursor steers rotation AND attracts growth.
       A lightweight ray-sphere hit (no rendering) gives the surface point
       under the cursor; growth biases its heading toward it.
       ============================================================ */
    const targetRot = new THREE.Vector2(0, 0);
    const steerInput = new THREE.Vector2(0, 0);
    const pointerNDC = new THREE.Vector2(0, 0);
    let pointerInside = false;

    const raycaster = new THREE.Raycaster();
    const hoverSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), CONFIG.sphere.radius);
    const _hit = new THREE.Vector3();
    const attractorLocal = new THREE.Vector3();
    let attractorActive = false;

    window.addEventListener("pointermove", (ev) => {
      pointerNDC.set((ev.clientX / window.innerWidth) * 2 - 1, -(ev.clientY / window.innerHeight) * 2 + 1);
      steerInput.copy(pointerNDC);
      pointerInside = true;
    });
    window.addEventListener("pointerleave", () => { steerInput.set(0, 0); pointerInside = false; });

    function updateAttractor() {
      attractorActive = false;
      if (!pointerInside) return;
      raycaster.setFromCamera(pointerNDC, camera);
      hoverSphere.radius = CONFIG.sphere.radius * sculpture.scale.x;
      if (!raycaster.ray.intersectSphere(hoverSphere, _hit)) return; // cursor off the sphere
      attractorLocal.copy(_hit);
      sculpture.worldToLocal(attractorLocal);
      attractorActive = true;
    }

    /* ============================================================
       Main loop
       ============================================================ */
    let lastSpawn = 0, nextSpawnIn = 0.4, growAccum = 0;
    const clock = new THREE.Clock();
    const r = {
      nodes:   document.getElementById("r-nodes"),
      edges:   document.getElementById("r-edges"),
      origins: document.getElementById("r-origins"),
      paths:   document.getElementById("r-paths"),
      dots:    document.getElementById("r-dots"),
    };
    r.nodes.textContent = nodeCount;
    r.edges.textContent = edgeCount;

    const _v = new THREE.Vector3();
    let dotsT = 0;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      // spawn new growth origins on a randomized cadence
      lastSpawn += dt;
      if (lastSpawn >= nextSpawnIn) {
        spawnGrowth();
        lastSpawn = 0;
        const [s0, s1] = CONFIG.growth.spawnEvery;
        nextSpawnIn = s0 + Math.random() * (s1 - s0);
      }

      // update the cursor attractor (surface point the growth leans toward)
      updateAttractor();

      // breadth-first growth ticks (fixed cadence → slow, mechanical wavefront)
      growAccum += dt;
      let ticks = 0;
      while (growAccum >= G.stepEvery && ticks < 3) { growStep(); growAccum -= G.stepEvery; ticks++; }

      // decay grown edge/node energies (the fade)
      const gdecay = Math.pow(G.decayPerSec, dt);
      for (let e = 0; e < edgeCount; e++) edgeEnergy[e] *= gdecay;
      for (let n = 0; n < nodeCount; n++) nodeEnergy[n] *= gdecay;

      // write edge colors (heat * energy; additive → faded/ungrown = invisible)
      const ecol = lineGeo.getAttribute("color");
      for (let e = 0; e < edgeCount; e++) {
        const en = edgeEnergy[e], o6 = e * 6, o3 = e * 3;
        const rr = edgeHeat[o3] * en, gg = edgeHeat[o3 + 1] * en, bb = edgeHeat[o3 + 2] * en;
        ecol.array[o6] = rr;     ecol.array[o6 + 1] = gg;     ecol.array[o6 + 2] = bb;
        ecol.array[o6 + 3] = rr; ecol.array[o6 + 4] = gg;     ecol.array[o6 + 5] = bb;
      }
      ecol.needsUpdate = true;

      // write node colors (lit only at grown vertices)
      const ncol = nodeGeo.getAttribute("color");
      for (let n = 0; n < nodeCount; n++) {
        const en = nodeEnergy[n], o3 = n * 3;
        ncol.array[o3] = nodeHeat[o3] * en; ncol.array[o3 + 1] = nodeHeat[o3 + 1] * en; ncol.array[o3 + 2] = nodeHeat[o3 + 2] * en;
      }
      ncol.needsUpdate = true;

      // rotation: mechanical drift + soft steer toward cursor (no overshoot)
      targetRot.y += CONFIG.rotation.idleSpeed * dt;
      targetRot.y += steerInput.x * CONFIG.rotation.steer * dt;
      targetRot.x += -steerInput.y * CONFIG.rotation.steer * dt;
      targetRot.x = Math.max(-0.9, Math.min(0.9, targetRot.x));
      sculpture.rotation.y += (targetRot.y - sculpture.rotation.y) * CONFIG.rotation.ease;
      sculpture.rotation.x += (targetRot.x - sculpture.rotation.x) * CONFIG.rotation.ease;

      // breathing (restrained)
      const breathe = 1 + Math.sin(t * CONFIG.breathing.speed) * CONFIG.breathing.amp;
      sculpture.scale.setScalar(breathe);

      // labels (no glow — UI chrome; mechanical fade)
      for (let i = activeLabels.length - 1; i >= 0; i--) {
        const L = activeLabels[i];
        L.age += dt;
        const lifeT = L.age / L.life;
        if (lifeT >= 1) { L.el.style.opacity = "0"; labelPool.push(L.el); activeLabels.splice(i, 1); continue; }
        _v.copy(L.pos);
        sculpture.localToWorld(_v);
        const facing = _v.clone().sub(camera.position).normalize();
        const normal = _v.clone().sub(sculpture.position).normalize();
        const front = facing.dot(normal) < 0;
        _v.project(camera);
        const x = (_v.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-_v.y * 0.5 + 0.5) * window.innerHeight;
        L.el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y - 16}px)`;
        const fade = Math.sin(Math.min(lifeT, 1) * Math.PI);
        L.el.style.opacity = front ? String(fade) : "0";
      }

      r.origins.textContent = String(networks.length).padStart(2, "0");
      r.paths.textContent = String(totalTips()).padStart(2, "0");
      dotsT += dt;
      if (dotsT > 0.4) { dotsT = 0; r.dots.textContent = ".".repeat((r.dots.textContent.length % 3) + 1); }

      renderBloom();
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      sizeTargets();
    });
  </script>
</body>
</html>
